entities:
  - id: env:wheat:leaf_rust_field_conditions
    type: EnvTrigger
    name: "Wheat leaf rust: field-observed temperature/humidity range for rising severity"
    crop: wheat
    props:
      # Field-correlation data from a single research station across 2 seasons, NOT a
      # controlled-inoculation infection threshold -- weighted accordingly (field_single_env)
      # rather than treated as a lab-validated infection window.
      phase: spread
      bbch_from: 30
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, min: 17.8, max: 30, aggregation: max, window_h: 24}
        - {variable: air_rh, min: 76.3, max: 85, aggregation: max, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc5_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 5): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 22, max: 26, aggregation: mean, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc0_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 0): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 24, max: 28, aggregation: mean, window_h: 24}

  - id: env:chickpea:collar_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea collar rot: soil moisture band associated with rising incidence"
    crop: chickpea
    props:
      # The source paper tested 4 discrete levels (40/60/80/100% soil moisture content) and found
      # disease rising from 40% ("limiting") through 60/80/100% ("optimum" band, peaking at 80%).
      # Modelled as a single min bound at the paper's own "lower optimum" (60%) rather than
      # inventing a precise continuous curve the paper doesn't give.
      phase: infection
      bbch_from: 0
      bbch_to: 22
      conditions:
        - {variable: soil_moisture_vwc, min: 60, aggregation: mean, window_h: 24}

  - id: env:soybean:frogeye_leaf_spot_rh_temp
    type: EnvTrigger
    name: "Soybean frogeye leaf spot: 30-day RH-hours + max temperature risk model"
    crop: soybean
    props:
      phase: spread
      bbch_from: 61
      bbch_to: 79
      conditions:
        - {variable: rh_ge_80_h, min: 15, max: 20, aggregation: mean, window_h: 720}
        - {variable: air_temp_c, min: 24, max: 36, aggregation: max, window_h: 24}

  - id: env:chickpea:dry_root_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea dry root rot: low soil moisture predisposing window"
    crop: chickpea
    props:
      # From the paper's own stress-treatment comparison (full text, not just the abstract,
      # which is silent on numbers): the low-soil-moisture and combined-stress treatments were
      # both held at 5-10% soil moisture vs. 15-25% for the well-watered control/pathogen-only
      # treatment, and disease incidence was highest in the combined (low-moisture + pathogen)
      # treatment. Modelled as a max bound at the paper's own upper edge of the stressed range.
      phase: infection
      bbch_from: 61
      bbch_to: 89
      conditions:
        - {variable: soil_moisture_vwc, max: 10, aggregation: mean, window_h: 24}

  - id: env:wheat:stripe_rust_cold_humid_window
    type: EnvTrigger
    name: "Wheat stripe rust: cold, humid decision-tree window (moderate-severity branch)"
    crop: wheat
    props:
      # This is the paper's own CART model's "moderate severity" branch (34-39% severity), not
      # its higher-severity branch, which also uses sunshine-hours and a "humid thermal index"
      # composite that aren't in config/vocab/sensors.yaml -- modelled only the branch whose
      # variables map cleanly onto sensors we actually have, rather than approximating the rest.
      phase: infection
      bbch_from: 13
      bbch_to: 75
      conditions:
        - {variable: air_temp_c, max: 9.1, aggregation: min, window_h: 24}
        - {variable: dew_point_c, min: 6.2, aggregation: mean, window_h: 24}
        - {variable: air_rh, min: 94, aggregation: mean, window_h: 24}

  - id: adv:wheat:leaf_rust_fungicide_timing
    type: Advisory
    # The source paper labels its spray timings "Zadok's scale 3, ZS 4.3, ZS 5.4" -- an unusual
    # decimal notation, not the standard two-digit Zadoks codes (e.g. Z43, Z54) used in
    # config/vocab/growth_stages.yaml. Not converted to a bbch_from/bbch_to here since AdvisoryProps
    # has no such field, and normalising the paper's own odd notation without being sure it maps
    # cleanly to Z43/Z54 would be a guess, not a grounded fact.
    name: "Prothioconazole spray, one or two applications, at the paper's own stem-elongation/booting/heading timings"
    crop: wheat
    props:
      action_type: chemical

  - id: adv:soybean:frogeye_leaf_spot_fungicide_stewardship
    type: Advisory
    name: "Avoid QoI-fungicide overreliance; combine with resistant cultivars"
    crop: soybean
    props:
      action_type: chemical

  - id: adv:chickpea:dry_root_rot_agronomic_management
    type: Advisory
    name: "Adjust sowing time/location, soil amendments and irrigation to avoid DRR-predisposing conditions"
    crop: chickpea
    props:
      action_type: cultural

  - id: adv:soybean:anthracnose_seed_treatment
    type: Advisory
    # Checked all three specifics from the original candidate_papers.yaml key_finding against this
    # paper's own full-text Disease Management section: seed treatment and declining fungicide
    # sensitivity are both real and quoted below; "phosphite-based seed treatments show promise"
    # is NOT in this paper at all -- flagged as such in candidate_papers.yaml, not included here.
    name: "Systemic fungicide seed treatment; fungicide efficacy is declining"
    crop: soybean
    props:
      action_type: chemical

  - id: adv:soybean:rhizoctonia_root_rot_integrated_control
    type: Advisory
    # The abstract mentions both cultural and chemical control together as the real-world response
    # to a lack of resistant genotypes; action_type only allows one value, so "cultural" was picked
    # as representative -- the chemical-control half of the same fact is in the quote, not lost.
    #
    # NO temperature-based DISEASE_ENV_TRIGGER for this disease, checked 2026-09-26: Dorrance et
    # al. 2003 (pmid:30812954) tested 20/24/28/32 degC and found infection occurred at all four --
    # "the temperatures evaluated in this study were not limiting to the isolates tested." That is
    # evidence AGAINST a 20-32 degC trigger, not evidence for one; encoding that range as a
    # min/max EnvTrigger condition would invert what the paper actually found. Dorrance's own
    # moisture arm (25/50/75/100% MHC) also found "no significant main effect on disease severity"
    # (only on stand/root weight) -- so that arm isn't modelled as a trigger either.
    #
    # UPDATE 2026-09-26 (third pass): a real, discriminating moisture-severity relationship WAS
    # found in a different, newer, larger study -- see env:soybean:rhizoctonia_low_moisture_severity
    # below (doi:10.36253/phyto-17030), which measured RRR severity itself (not just stand/yield)
    # against soil moisture across 2 experiments and 5 soil types. That is now this disease's only
    # EnvTrigger, and it is about MOISTURE, not temperature -- Dorrance's temperature non-finding
    # above still stands and is not contradicted.
    name: "Cultural + chemical control, given the dearth of resistant genotypes"
    crop: soybean
    props:
      action_type: cultural

  - id: adv:soybean:pod_stem_blight_resistant_cultivars
    type: Advisory
    name: "Plant a lower-infection cultivar (6 identified: Morsoy R2 491, Progeny 5650/5706, Asgrow 5606/5831, Dyna-Gro33C59)"
    crop: soybean
    props:
      action_type: varietal

  - id: env:soybean:charcoal_rot_high_temp
    type: EnvTrigger
    name: "Soybean charcoal rot: high soil temperature driving M. phaseolina dominance/severity"
    crop: soybean
    props:
      # The source ran controlled incubation at 25 vs 35 degC; modelled as a soil_temp_c mean
      # bound since charcoal rot is soil-borne and this is what AgriNode's soil probe measures.
      # The paper's moisture-stress finding (watering frequency, not a % soil moisture value) is
      # NOT modelled as a numeric condition here -- see adv:soybean:charcoal_rot_irrigation_management.
      phase: expression
      bbch_from: 9
      bbch_to: 81
      conditions:
        - {variable: soil_temp_c, min: 35, aggregation: mean, window_h: 24}

  - id: adv:soybean:charcoal_rot_irrigation_management
    type: Advisory
    name: "Avoid moisture stress (maintain regular irrigation), especially under high soil temperature"
    crop: soybean
    props:
      action_type: cultural

  - id: adv:chickpea:collar_rot_biological_seed_treatment
    type: Advisory
    # A candidate practice from a single glasshouse study, not a field-validated universal
    # recommendation -- deliberately not overstated as such (matches the caution the paper's own
    # abstract quote supports, nothing more).
    name: "Seed bio-priming with Pseudomonas sp. CDB35 (or captan) reduced disease incidence in a glasshouse trial"
    crop: chickpea
    props:
      action_type: biological

  - id: env:wheat:stem_rust_infection_onset
    type: EnvTrigger
    name: "Wheat stem rust: mechanistic infection-onset rule (rain, wetness, temperature)"
    crop: wheat
    props:
      # The paper's own Onset rule is a compound/sequential condition -- a rain event, THEN a
      # wetness period following it, with a mean temperature check specifically during that
      # wetness period. Our TriggerCondition model checks independent windowed bounds, not
      # sequential/conditional logic, so this is an approximation: rain and leaf-wetness-hours are
      # checked as their own independent conditions, and temperature is checked as a 24h mean
      # rather than specifically "during the wetness period." Tmin=4/Tmax=35 for uredospore
      # germination (broader, secondary parameterization in the source paper) are not modelled
      # separately here -- the Onset rule is the paper's own primary decision criterion.
      phase: infection
      bbch_from: 45
      bbch_to: 85
      conditions:
        - {variable: rain_mm, min: 1, aggregation: sum, window_h: 1}
        - {variable: est_leaf_wet_h, min: 3, aggregation: sum, window_h: 24}
        - {variable: air_temp_c, min: 15, max: 32, aggregation: mean, window_h: 24}

  - id: adv:wheat:fusarium_head_blight_fungicide_timing
    type: Advisory
    name: "Apply DMI or DMI+SDHI fungicide 1-4 days before infection, not after -- efficacy drops sharply post-infection"
    crop: wheat
    props:
      action_type: chemical

  - id: env:soybean:rust_infection_20_25c
    type: EnvTrigger
    # The source paper describes two distinct favourable temperature/dew-duration bands, not one
    # generalised rule -- modelled as two separate EnvTrigger entities to match the paper's own
    # structure exactly rather than inventing a merged range it doesn't state.
    name: "Soybean rust: infection at 20-25 degC with >=6h dew/leaf wetness"
    crop: soybean
    props:
      phase: infection
      bbch_from: 61
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, min: 20, max: 25, aggregation: mean, window_h: 24}
        - {variable: est_leaf_wet_h, min: 6, aggregation: sum, window_h: 24}

  - id: env:soybean:rust_infection_15_17_5c
    type: EnvTrigger
    name: "Soybean rust: infection at 15-17.5 degC with >=8h dew/leaf wetness"
    crop: soybean
    props:
      phase: infection
      bbch_from: 61
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, min: 15, max: 17.5, aggregation: mean, window_h: 24}
        - {variable: est_leaf_wet_h, min: 8, aggregation: sum, window_h: 24}

  - id: env:wheat:fusarium_head_blight_infection_temp
    type: EnvTrigger
    name: "Wheat FHB (F. graminearum): controlled-environment infection-frequency optimum"
    crop: wheat
    props:
      # The paper's own detached-spike inoculation experiment tested 10.0-35.0 degC and found
      # F. graminearum's infection-frequency optimum at 28.0-29.0 degC (F. avenaceum shared this
      # optimum; M. nivale and F. culmorum had lower, different optima not modelled here since
      # F. graminearum is this KB's DISEASE_CAUSED_BY pathogen for FHB). Modelled as a band around
      # the paper's own optimum rather than the full 10-35 degC tested range, since the tested
      # range is not itself the infection-conducive window.
      phase: infection
      bbch_from: 59
      bbch_to: 69
      conditions:
        - {variable: air_temp_c, min: 26, max: 31, aggregation: mean, window_h: 24}

  - id: env:wheat:powdery_mildew_temp_ceiling
    type: EnvTrigger
    name: "Wheat powdery mildew: temperature ceiling above which disease does not develop"
    crop: wheat
    props:
      # The paper's own phytotron data (6 CO2 x temperature combinations, 3 trial repeats): disease
      # index was 68-79 at 18-22 degC, 37-72 at 22-26 degC, and a flat 0.00 at 26-30 degC
      # regardless of CO2 level -- a real discriminating cutoff, not a correlation. Modelled as a
      # max-bound condition (risk exists only when the 24h mean stays below the paper's own
      # lower edge of the "no disease" band) rather than inventing a lower bound the paper
      # doesn't give a clean number for.
      phase: infection
      bbch_from: 30
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, max: 26, aggregation: mean, window_h: 24}

  - id: env:soybean:anthracnose_wetness_duration
    type: EnvTrigger
    name: "Soybean anthracnose (C. truncatum): minimum wetness duration for lesion development at 30 degC"
    crop: soybean
    props:
      # The paper's own controlled-environment data: C. truncatum (the main soybean anthracnose
      # species) needed >=8h of wetness at 30 degC for lesions to develop; at >=32h wetness,
      # lesions were larger at 25 than 30 degC. Modelled the primary 30 degC/8h rule since it is
      # the paper's own clearest single threshold; the secondary 25 degC/32h crossover is not
      # separately modelled to avoid inventing a second, less-supported rule.
      phase: infection
      bbch_from: 0
      bbch_to: 89
      conditions:
        - {variable: air_temp_c, min: 28, max: 32, aggregation: mean, window_h: 24}
        - {variable: est_leaf_wet_h, min: 8, aggregation: sum, window_h: 24}

  - id: env:soybean:pod_stem_blight_rainfall_podfill
    type: EnvTrigger
    name: "Soybean Phomopsis seed decay: rainfall during pod fill drives incidence (field-condition, not seed-moisture)"
    crop: soybean
    props:
      # The paper's own 3-year, >8,000-seedlot Illinois field study: a high positive correlation
      # (r^2=0.75 in the multiple-regression model, Y=-4.0+0.35X, X = total rainfall in cm over
      # Aug+Sep+Oct) was found between rainfall during pod fill/maturation and percent seed decay;
      # temperature and geography were NOT the dominant factors. The paper's own accumulation
      # window is 3 months (~2160h), which exceeds this model's 720h (30-day) window_h cap -- the
      # 130mm/720h threshold below is a monthly-equivalent approximation of the paper's 3-month
      # regression (roughly the rainfall needed, sustained for a month, to reach the paper's own
      # "high incidence" range), not a value the paper states directly.
      phase: infection
      bbch_from: 71
      bbch_to: 89
      conditions:
        - {variable: rain_mm, min: 130, aggregation: sum, window_h: 720}

  - id: env:soybean:rhizoctonia_low_moisture_severity
    type: EnvTrigger
    name: "Soybean Rhizoctonia root rot: low soil moisture (<=65% WHC) intensifies severity"
    crop: soybean
    props:
      # This is a genuinely different, discriminating finding from Dorrance et al. 2003's
      # non-finding on temperature (see the DELIBERATELY-NO-TRIGGER note on
      # adv:soybean:rhizoctonia_root_rot_integrated_control below, which stays accurate: that note
      # is about TEMPERATURE and about Dorrance's own MOISTURE arm, which found no significant
      # main effect on disease SEVERITY specifically -- only on stand/root weight). This 2026 paper
      # measured RRR severity itself against soil moisture across 2 greenhouse experiments, 5 soil
      # types: severity fell linearly and significantly (R^2 mostly >0.70) as moisture rose from
      # 50 to 95% WHC; at <=65% WHC severity was consistently high (well-developed symptoms,
      # scores >=3) regardless of soil type. Modelled as an inverse condition (risk when moisture
      # stays AT OR BELOW the paper's own low-moisture band) using max only, matching this file's
      # existing pattern for other "low value = risk" triggers (e.g. dry_root_rot_soil_moisture).
      # Phase is "expression" (not "infection") because the paper's own severity effect is a
      # season-long moisture regime, not a discrete infection event -- same reasoning as
      # env:soybean:charcoal_rot_high_temp's phase choice.
      phase: expression
      bbch_from: 0
      bbch_to: 99
      conditions:
        - {variable: soil_moisture_vwc, max: 65, aggregation: mean, window_h: 24}

  - id: adv:wheat:stem_rust_fungicide_timing
    type: Advisory
    name: "Curative fungicide 1, 3 or 5 days after inoculation gives effective stem rust control; azole+strobilurin or azole+carboxamide mixtures outperform azole alone"
    crop: wheat
    props:
      action_type: chemical

  - id: adv:wheat:stripe_rust_fungicide_efficacy
    type: Advisory
    name: "Two foliar sprays of tebuconazole 25 EC give near-complete (99.64%) yellow rust control; azoxystrobin+difenoconazole gives the best yield response"
    crop: wheat
    props:
      action_type: chemical

  - id: adv:soybean:rust_fungicide_timing_yield
    type: Advisory
    name: "Fungicide timing should track first detection of rust: spray at GS R1 if rust appears before R3, spray at R3/R5 if it appears after -- yield gains 12-114% over untreated"
    crop: soybean
    props:
      action_type: chemical

  - id: adv:chickpea:fusarium_wilt_sowing_date
    type: Advisory
    name: "Early sowing (mid-December vs. mid-February) significantly reduces Fusarium wilt incidence, AUDPC and disease-progress rate; pair with partially resistant genotypes"
    crop: chickpea
    props:
      action_type: cultural

  - id: adv:chickpea:rust_fungicide_efficacy
    type: Advisory
    name: "Two sprays of azoxystrobin 18.2% + difenoconazole 11.4% SC at a 15-day interval cut rust severity by >77%"
    crop: chickpea
    props:
      action_type: chemical

