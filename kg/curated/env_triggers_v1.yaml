# First real DISEASE_ENV_TRIGGER content (Phase 5/8 work: config/sources/candidate_papers.yaml's
# `key_findings` turned into cited, quote-grounded claims). Read this file's history before
# trusting any future addition to it:
#
# When re-checking each candidate paper's `key_findings.environmental` text against its actual,
# freely available abstract (2026-09-26), most of them did NOT hold up -- the numeric thresholds
# I'd written in candidate_papers.yaml for wheat powdery mildew, chickpea dry root rot, and
# soybean charcoal rot are not present in those papers' abstracts at all (they must have come from
# a full-text read I no longer have access to, or from general knowledge, and got mis-attributed
# to a paper's own abstract when the reading-list file was written). Wheat stripe rust's own entry
# in candidate_papers.yaml already self-flagged this same risk ("unverified separately -- flagged,
# not cited on its own"). This confirms candidate_papers.yaml's own warning was correct: its
# key_findings are a triage summary, NOT a grounded Evidence record, and must be re-verified
# against real abstract/full-text before becoming a claim -- never copied over trusting the
# reading-list file alone, no matter how "verified_via: europepmc_id" that file's source entry is.
#
# UPDATE 2026-09-26 (second pass, same day): Europe PMC serves full-text XML for the
# open-access subset (endpoint: /webservices/rest/{PMCID}/fullTextXML, found via a
# `isOpenAccess`/`pmcid` check on the search API first) -- this unlocked 2 more diseases whose
# abstracts alone were silent: chickpea dry root rot (the actual number is a soil-moisture
# contrast between stress treatments, not the "35 degC / <=60%" figure that still isn't
# confirmed anywhere) and wheat stripe rust (using the paper's own CART decision-tree result,
# replacing the "unverified Moroccan study" citation that was flagged from the start). Two more
# open-access full texts (soybean anthracnose, wheat powdery mildew's paper was NOT open access
# so stays unresolved) were checked and still had no numbers even in full text -- see the
# now-doubly-confirmed UNVERIFIED note added to soybean anthracnose in candidate_papers.yaml.
# Soybean charcoal rot's review and several soybean/wheat Wiley papers are confirmed NOT
# open-access (checked via the same isOpenAccess flag) -- those still need real institutional
# access, not another automated attempt.
#
# 6 diseases now have a trigger. The rest are a real, open gap for the reasons above.

sources:
  - id: pmid:38952372
    type: publication
    title: "Genotypes, epidemiological variables and fungicides application associated with wheat leaf rust development and grain yield"
    year: 2024
    venue: Heliyon
    url: https://pubmed.ncbi.nlm.nih.gov/38952372/
    verified: true

  - id: pmid:18943575
    type: publication
    title: "Quantitative Modeling of the Effects of Temperature and Inoculum Density of Fusarium oxysporum f. sp. ciceris Races 0 and 5 on Development of Fusarium Wilt in Chickpea Cultivars"
    year: 2007
    venue: Phytopathology
    url: https://pubmed.ncbi.nlm.nih.gov/18943575/
    verified: true

  - id: pmid:30158943
    type: publication
    title: "Exploring Combined Effect of Abiotic (Soil Moisture) and Biotic (Sclerotium rolfsii Sacc.) Stress on Collar Rot Development in Chickpea"
    year: 2018
    venue: "Frontiers in Plant Science"
    url: https://pubmed.ncbi.nlm.nih.gov/30158943/
    verified: true

  - id: pmid:41957394
    type: publication
    title: "Modeling the environment-related risk of frogeye leaf spot (Cercospora sojina) in soybean across the United States"
    year: 2026
    venue: "Scientific Reports"
    url: https://pubmed.ncbi.nlm.nih.gov/41957394/
    verified: true

  - id: pmid:33753791
    type: publication
    title: "Low soil moisture predisposes field-grown chickpea plants to dry root rot disease: evidence from simulation modeling and correlation analysis"
    year: 2021
    venue: "Scientific Reports"
    url: https://pubmed.ncbi.nlm.nih.gov/33753791/
    verified: true

  - id: pmid:42111728
    type: publication
    title: "A weather-informed decision tree framework for predicting stripe rust outbreaks in wheat"
    year: 2026
    venue: "Frontiers in Plant Science"
    url: https://pubmed.ncbi.nlm.nih.gov/42111728/
    verified: true

entities:
  - id: env:wheat:leaf_rust_field_conditions
    type: EnvTrigger
    name: "Wheat leaf rust: field-observed temperature/humidity range for rising severity"
    crop: wheat
    props:
      # Field-correlation data from a single research station across 2 seasons, NOT a
      # controlled-inoculation infection threshold -- weighted accordingly (field_single_env)
      # rather than treated as a lab-validated infection window.
      phase: spread
      bbch_from: 30
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, min: 17.8, max: 30, aggregation: max, window_h: 24}
        - {variable: air_rh, min: 76.3, max: 85, aggregation: max, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc5_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 5): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 22, max: 26, aggregation: mean, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc0_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 0): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 24, max: 28, aggregation: mean, window_h: 24}

  - id: env:chickpea:collar_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea collar rot: soil moisture band associated with rising incidence"
    crop: chickpea
    props:
      # The source paper tested 4 discrete levels (40/60/80/100% soil moisture content) and found
      # disease rising from 40% ("limiting") through 60/80/100% ("optimum" band, peaking at 80%).
      # Modelled as a single min bound at the paper's own "lower optimum" (60%) rather than
      # inventing a precise continuous curve the paper doesn't give.
      phase: infection
      bbch_from: 0
      bbch_to: 22
      conditions:
        - {variable: soil_moisture_vwc, min: 60, aggregation: mean, window_h: 24}

  - id: env:soybean:frogeye_leaf_spot_rh_temp
    type: EnvTrigger
    name: "Soybean frogeye leaf spot: 30-day RH-hours + max temperature risk model"
    crop: soybean
    props:
      phase: spread
      bbch_from: 61
      bbch_to: 79
      conditions:
        - {variable: rh_ge_80_h, min: 15, max: 20, aggregation: mean, window_h: 720}
        - {variable: air_temp_c, min: 24, max: 36, aggregation: max, window_h: 24}

  - id: env:chickpea:dry_root_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea dry root rot: low soil moisture predisposing window"
    crop: chickpea
    props:
      # From the paper's own stress-treatment comparison (full text, not just the abstract,
      # which is silent on numbers): the low-soil-moisture and combined-stress treatments were
      # both held at 5-10% soil moisture vs. 15-25% for the well-watered control/pathogen-only
      # treatment, and disease incidence was highest in the combined (low-moisture + pathogen)
      # treatment. Modelled as a max bound at the paper's own upper edge of the stressed range.
      phase: infection
      bbch_from: 61
      bbch_to: 89
      conditions:
        - {variable: soil_moisture_vwc, max: 10, aggregation: mean, window_h: 24}

  - id: env:wheat:stripe_rust_cold_humid_window
    type: EnvTrigger
    name: "Wheat stripe rust: cold, humid decision-tree window (moderate-severity branch)"
    crop: wheat
    props:
      # This is the paper's own CART model's "moderate severity" branch (34-39% severity), not
      # its higher-severity branch, which also uses sunshine-hours and a "humid thermal index"
      # composite that aren't in config/vocab/sensors.yaml -- modelled only the branch whose
      # variables map cleanly onto sensors we actually have, rather than approximating the rest.
      phase: infection
      bbch_from: 13
      bbch_to: 75
      conditions:
        - {variable: air_temp_c, max: 9.1, aggregation: min, window_h: 24}
        - {variable: dew_point_c, min: 6.2, aggregation: mean, window_h: 24}
        - {variable: air_rh, min: 94, aggregation: mean, window_h: 24}

claims:
  - type: DISEASE_ENV_TRIGGER
    subject: dis:wheat:leaf_rust
    object: env:wheat:leaf_rust_field_conditions
    evidence:
      - source: pmid:38952372
        method: field_single_env
        locator: abstract
        quote: "Leaf rust severity (%) increased with an increase in maximum temperature (17.8-30 °C), maximum relative humidity (76.3-85 %)"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:fusarium_wilt
    object: env:chickpea:fusarium_wilt_foc5_soil_temp
    evidence:
      - source: pmid:18943575
        method: controlled_env
        locator: abstract
        quote: "The models estimated 22 to 26 degrees C as the most favorable soil temperature for infection of cvs. P-2245 and PV-61 by Foc-5"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:fusarium_wilt
    object: env:chickpea:fusarium_wilt_foc0_soil_temp
    evidence:
      - source: pmid:18943575
        method: controlled_env
        locator: abstract
        quote: "24 to 28 degrees C for infection of cv. P-2245 by Foc-0"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:collar_rot
    object: env:chickpea:collar_rot_soil_moisture
    evidence:
      - source: pmid:30158943
        method: controlled_env
        locator: abstract
        quote: "Maximum incidence was observed at 80% SMC, followed by 100 and 60% SMC"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:soybean:frogeye_leaf_spot
    object: env:soybean:frogeye_leaf_spot_rh_temp
    evidence:
      - source: pmid:41957394
        method: field_multi_env
        locator: abstract
        quote: "FLS risk peaked when the 30-d ma of daily hours of RH ≥ 80% was 15–20 h and maximum temperature was 24–36 °C"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:dry_root_rot
    object: env:chickpea:dry_root_rot_soil_moisture
    evidence:
      - source: pmid:33753791
        method: controlled_env
        locator: "full text, Results"
        quote: "The soil moisture content in LSM and CS was 5-10%, whereas in the control and PS, it was around 15-25%"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:wheat:stripe_rust
    object: env:wheat:stripe_rust_cold_humid_window
    evidence:
      - source: pmid:42111728
        method: field_multi_env
        locator: "full text, Results (CART model)"
        quote: "Yellow rust severity remained moderate (34-39%) when Tmin < 9.1 °C, Tdew ≥ 6.2 °C and RHm ≥ 94%"
