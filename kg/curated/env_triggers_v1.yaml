# First real DISEASE_ENV_TRIGGER content (Phase 5/8 work: config/sources/candidate_papers.yaml's
# `key_findings` turned into cited, quote-grounded claims). Read this file's history before
# trusting any future addition to it:
#
# When re-checking each candidate paper's `key_findings.environmental` text against its actual,
# freely available abstract (2026-09-26), most of them did NOT hold up -- the numeric thresholds
# I'd written in candidate_papers.yaml for wheat powdery mildew, chickpea dry root rot, and
# soybean charcoal rot are not present in those papers' abstracts at all (they must have come from
# a full-text read I no longer have access to, or from general knowledge, and got mis-attributed
# to a paper's own abstract when the reading-list file was written). Wheat stripe rust's own entry
# in candidate_papers.yaml already self-flagged this same risk ("unverified separately -- flagged,
# not cited on its own"). This confirms candidate_papers.yaml's own warning was correct: its
# key_findings are a triage summary, NOT a grounded Evidence record, and must be re-verified
# against real abstract/full-text before becoming a claim -- never copied over trusting the
# reading-list file alone, no matter how "verified_via: europepmc_id" that file's source entry is.
#
# UPDATE 2026-09-26 (second pass, same day): Europe PMC serves full-text XML for the
# open-access subset (endpoint: /webservices/rest/{PMCID}/fullTextXML, found via a
# `isOpenAccess`/`pmcid` check on the search API first) -- this unlocked 2 more diseases whose
# abstracts alone were silent: chickpea dry root rot (the actual number is a soil-moisture
# contrast between stress treatments, not the "35 degC / <=60%" figure that still isn't
# confirmed anywhere) and wheat stripe rust (using the paper's own CART decision-tree result,
# replacing the "unverified Moroccan study" citation that was flagged from the start). Two more
# open-access full texts (soybean anthracnose, wheat powdery mildew's paper was NOT open access
# so stays unresolved) were checked and still had no numbers even in full text -- see the
# now-doubly-confirmed UNVERIFIED note added to soybean anthracnose in candidate_papers.yaml.
# Soybean charcoal rot's review and several soybean/wheat Wiley papers are confirmed NOT
# open-access (checked via the same isOpenAccess flag) -- those still need real institutional
# access, not another automated attempt.
#
# 6 diseases now have a trigger. The rest are a real, open gap for the reasons above.

