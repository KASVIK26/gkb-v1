# Notified varieties for wheat, soybean and chickpea in Central Zone/MP (primary) and the
# Peninsular Zone/Maharashtra (secondary) per docs/scope.md. Built 2026-09-26, extended same day.
#
# No AICRP/ICAR source document was available from the user, so this was built by direct
# research. Confidence is NOT uniform across crop x region -- say so plainly rather than hide it:
#
#   wheat (MP + Maharashtra): tier "official_document" for nearly everything -- pulled from the
#              actual government-published table (ICAR-IIWBR, "Wheat Varieties Notified in India
#              Since 1965"), covering BOTH the Central Zone and the Peninsular Zone, with exact
#              notification numbers and dates. Extracted directly from the PDF text, not
#              summarized from a search snippet. One cross-check worth noting: GW 322 appears in
#              both zone tables with the IDENTICAL notification number (937(E), 04.09.2002) --
#              internal consistency check passed.
#   chickpea:  UPGRADED 2026-09-26 to "official_document" for most entries. The DPD chickpea PDF
#              that failed to connect in the previous pass was reached this time via the Wayback
#              Machine archive (the live dpd.gov.in server itself is still unreliable from this
#              network; the archived copy is dated 2024-07-01 and covers releases through 2021).
#              Covers Central-released AND State-released varieties, i.e. both MP and Maharashtra
#              directly, from one document.
#   soybean:   tier "multi_source_corroborated" -- the Directorate of Oilseeds Development's own
#              soybean page (oilseeds.dac.gov.in) plus cross-checked search results for both MP
#              and Maharashtra. No single notification-number-level government document was found
#              or reachable for soybean specifically (unlike wheat/DPD-chickpea).
#
# tier: official_document | multi_source_corroborated | single_source (needs more checking)
# zone: "CZ" = wheat/chickpea Central Zone; "PZ" = wheat Peninsular Zone (Maharashtra+Karnataka);
#       "MP" / "MH" = state-specific recommendation, not the full zone
# institute_is_mp / institute_is_mh: true if the releasing institute itself sits in that state
#   (JNKVV Jabalpur+stations & RVSKVV Gwalior/Sehore for MP; PDKV Akola, MPKV Rahuri/Niphad,
#   ARI Pune for MH) -- vs. a variety recommended for the state but bred elsewhere in the zone.
#
# NOT yet in kg/curated/ -- this is sourced research, not a loaded release. Turning this into
# Variety entities + VARIETY_RECOMMENDED_FOR_ZONE claims is the next step (Phase 3).

schema_version: 2

