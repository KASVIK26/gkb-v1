name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-tests:
    name: Tests (Python 3.12, PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret (ephemeral CI container)
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres  # pragma: allowlist secret
      REQUIRE_DB_TESTS: "1"  # fail instead of skipping if the database is unreachable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (unit + schema/CQ against the Postgres service; skip live-service integration tests)
        run: python -m pytest tests/ -q -m "not integration" --tb=short

      - name: Secret scan and repo hygiene (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure
