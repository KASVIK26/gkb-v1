# First real (non-toy) curated content, replacing archive/legacy_v1/seed_data.py.
# Every fact below was checked against its cloning paper's title/abstract on Europe PMC
# before being written here — none are typed from memory. See RESEARCH_ROADMAP.md §2.2 D3
# for the specific errors this replaces (Sr33 was wrongly given as chromosome 1B there, then
# "corrected" to 1DL during the initial audit — also wrong; verified here as 1DS).
#
# Status: status defaults to "unreviewed" below (nothing here is force-marked "reviewed" —
# that's a deliberate human sign-off step, not something to skip even when the sourcing is
# solid). Flip a claim's `status: reviewed` once you've spot-checked it yourself.
#
# 2026-09-26 addition: Yr6NLR1/Yr6NLR2, Pm6 (=Pm52), and Pm37 -- verified the same way, but this
# time by pulling the papers' own open-access full text (Europe PMC fullTextXML), not just the
# abstract, since none of the three had the chromosome/validation details in their abstract alone.
#
# 2026-09-26, Phase 4.3 (BLASTP anchoring): tried anchoring all 4 of the wheat genes that have a
# real, complete, verifiable published protein sequence (Sr33, Sr35, Lr34, Lr21) against the
# IWGSC CS RefSeq v2.1 proteome. Only Lr34 produced a confident anchor (GENE_LOCATED_AT below).
# Sr33 and Sr35's donor species (Aegilops tauschii, Triticum monococcum) mean the Chinese Spring
# reference never carried the actual introgressed allele in the first place -- their best hits
# (~87-90% identity) are the closest native wheat paralogs, not the anchor point, so no claim was
# written for them. Lr21's best hit was only 63.6% identity, too divergent to call confidently.
#
# IMPORTANT CAUGHT ERROR, worth keeping the record of: Lr34's single highest-scoring BLAST hit
# (100% identity, LOC123087958) is on chromosome 4A -- which contradicts the well-established
# literature chromosome (7DS, Krattinger et al. 2009, cited above as pmid:19229000). Taking "best
# hit by score" at face value would have anchored Lr34 to the wrong chromosome. The actual anchor
# used below (LOC123169079, chromosome 7D, ~97% identity, two isoforms) was found by checking each
# hit's chromosome against the literature instead of trusting rank order -- the 4A hit is a
# same-family ABC-transporter paralog, not Lr34. Automating "best hit" anchoring at scale would
# need this same cross-check built in, not just a raw top-hit take.



