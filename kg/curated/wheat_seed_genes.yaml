# First real (non-toy) curated content, replacing archive/legacy_v1/seed_data.py.
# Every fact below was checked against its cloning paper's title/abstract on Europe PMC
# before being written here — none are typed from memory. See RESEARCH_ROADMAP.md §2.2 D3
# for the specific errors this replaces (Sr33 was wrongly given as chromosome 1B there, then
# "corrected" to 1DL during the initial audit — also wrong; verified here as 1DS).
#
# Status: status defaults to "unreviewed" below (nothing here is force-marked "reviewed" —
# that's a deliberate human sign-off step, not something to skip even when the sourcing is
# solid). Flip a claim's `status: reviewed` once you've spot-checked it yourself.

sources:
  - id: pmid:23811228
    type: publication
    title: "The gene Sr33, an ortholog of barley Mla genes, encodes resistance to wheat stem rust race Ug99"
    year: 2013
    venue: Science
    url: https://doi.org/10.1126/science.1239028
    verified: true

  - id: pmid:23811222
    type: publication
    title: "Identification of wheat gene Sr35 that confers resistance to Ug99 stem rust race group"
    year: 2013
    venue: Science
    url: https://pubmed.ncbi.nlm.nih.gov/23811222/
    verified: true

  - id: pmid:19229000
    type: publication
    title: "A putative ABC transporter confers durable resistance to multiple fungal pathogens in wheat"
    year: 2009
    venue: Science
    url: https://doi.org/10.1126/science.1166453
    verified: true

  - id: pmid:21573954
    type: publication
    title: "A multiple resistance locus on chromosome arm 3BS in wheat confers resistance to stem rust (Sr2), leaf rust (Lr27) and powdery mildew"
    year: 2011
    venue: "Theoretical and Applied Genetics"
    url: https://doi.org/10.1007/s00122-011-1611-y
    verified: true

  - id: pmid:16283230
    type: publication
    title: "High-resolution mapping and mutation analysis separate the rust resistance genes Sr31, Lr26 and Yr9 on the short arm of rye chromosome 1"
    year: 2005
    venue: "Theoretical and Applied Genetics"
    url: https://doi.org/10.1007/s00122-005-0098-9
    verified: true

  - id: pmid:30841334
    type: publication
    title: "Detection of Virulence to Wheat Stem Rust Resistance Gene Sr31 in Puccinia graminis f. sp. tritici in Uganda"
    year: 2000
    venue: "Plant Disease"
    url: https://doi.org/10.1094/pdis.2000.84.2.203b
    verified: true

  - id: cat:maswheat_sr50
    type: catalogue
    title: "MASWheat: Stem rust resistance gene Sr50"
    venue: "MASWheat / GrainGenes"
    url: https://graingenes.org/GG3/content/maswheat-stem-rust-resistance-gene-sr50
    verified: true

  - id: pmid:27776114
    type: publication
    title: "Wheat Fhb1 encodes a chimeric lectin with agglutinin domains and a pore-forming toxin-like domain conferring resistance to Fusarium head blight"
    year: 2016
    venue: "Nature Genetics"
