      year: 2026
      authors: "Gonzalez-Acuna JF, Allen TW, Bish MD, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/41957394/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
