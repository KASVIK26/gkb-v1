          were not separately confirmed -- do not treat those specifics as sourced to this paper.
          Original text, kept for the record: "QoI-fungicide resistance (Cytochrome b G143A
          mutation) is now widespread; Rcs-gene resistant cultivars + rotation/tillage are the
          sustainable path; spray window is growth stage R3-R5."

