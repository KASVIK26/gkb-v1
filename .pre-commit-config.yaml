repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        # kg/manifest.json is intentionally full of SHA-256/git-SHA hex strings that change on
        # every build -- that's its whole purpose, not a secret leak, and baselining one specific
        # hash value would need redoing on every single build.
        exclude: ^(data/|\.venv|\.wrangler/|tests/fixtures/|kg/manifest\.json)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
