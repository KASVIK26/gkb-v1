# Verified candidate paper bibliography, one entry per disease (config/vocab/diseases.yaml IDs).
# Built 2026-09-26 by targeted search + identity verification (Europe PMC lookup by PMID/PMCID,
# or a direct search-engine hit on the real title/journal/PMID/DOI together) for EVERY entry below
# -- never typed from memory. This directly replaces the pattern that failed in
# scripts/fetch_papers.py's old CURATED_PAPERS list (RESEARCH_ROADMAP.md Appendix B): that list's
# PMIDs were never checked and pointed at unrelated papers.
#
# What this file IS: a vetted reading list -- real papers, on the right pathogen, with a short
# factual note on what each says about (a) environmental conditions and (b) management, so you can
# sanity-check them before anything is extracted.
# What this file is NOT: KG claims. `key_findings` below are my summary for triage, not a
# verbatim-quoted, grounded Evidence record -- turning these into VARIETY_REACTION /
# DISEASE_ENV_TRIGGER / DISEASE_MANAGED_BY claims (with the actual quote checked against full
# text) is Phase 5 work, done through curator/extractors, not by copying key_findings into kg/curated/.
#
# verified_via:
#   europepmc_id     - looked up by its own PMID/PMCID on Europe PMC, title matched
#   europepmc_title  - looked up by exact title on Europe PMC, PMID/DOI matched
#   search_result    - title/journal/identifier confirmed directly in live search-engine results
#                       (no PMID exists, e.g. an extension publication) -- weaker than the above,
#                       flagged explicitly, never silently treated as peer-reviewed
#
# source_type: peer_reviewed_primary | peer_reviewed_review | extension_publication
#
# Coverage: all 17 in-scope diseases have at least one entry. Depth varies with how much the
# literature itself covers each disease -- that unevenness is real, not a search gap (e.g.
# chickpea rust has genuinely little forecasting literature compared to wheat rusts).

schema_version: 1

wheat:
  dis:wheat:stripe_rust:
    - pmid: "42111728"
      title: "A weather-informed decision tree framework for predicting stripe rust outbreaks in wheat"
      journal: "Frontiers in Plant Science"
      year: 2026
      authors: "Anand S, Sandhu SK, Biswas B, Tak PS"
      url: https://pubmed.ncbi.nlm.nih.gov/42111728/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
      key_findings:
        environmental: >-
          RESOLVED 2026-09-26: the originally-flagged "Moroccan study, unverified" figures below
          were never used in a claim and are superseded. Pulled this paper's own full text (it's
          open access, PMCID PMC13152867) and used its own CART decision-tree result instead --
          see kg/curated/env_triggers_v1.yaml (env:wheat:stripe_rust_cold_humid_window): "Yellow
          rust severity remained moderate (34-39%) when Tmin < 9.1 degC, Tdew >= 6.2 degC and RHm
          >= 94%." A separate higher-severity branch exists too (uses sunshine-hours and a "humid
          thermal index" not in our sensor vocab) but wasn't modelled. Original superseded text,
          kept for the record: a related Moroccan modelling study (unverified separately) reports
          RH > 92% and 4-16 degC for >= 4 continuous hours, rainfall <= 0.1 mm.
        management: "Not the focus of this paper (forecasting model); pair with fungicide-timing sources below."

  dis:wheat:leaf_rust:
    - pmid: "38952372"
      title: "Genotypes, epidemiological variables and fungicides application associated with wheat leaf rust development and grain yield"
      journal: Heliyon
      year: 2024
      authors: "Aatif HM, Saeed S, Ali Y, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/38952372/
      source_type: peer_reviewed_primary
