        management: "Virus-free certified seed + avoiding late planting (reduces aphid-transmission window); no fully SMV-resistant commercial cultivars exist yet."

chickpea:
  dis:chickpea:fusarium_wilt:
    - pmid: "18943575"
      title: "Quantitative Modeling of the Effects of Temperature and Inoculum Density of Fusarium oxysporum f. sp. ciceris Races 0 and 5 on Development of Fusarium Wilt in Chickpea Cultivars"
      journal: Phytopathology
      year: 2007
      authors: "Navas-Cortes JA, Landa BB, Mendez-Rodriguez MA, Jimenez-Diaz RM"
      url: https://pubmed.ncbi.nlm.nih.gov/18943575/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
      key_findings:
        environmental: "Race 5 optimum 22-26 degC soil temperature, race 0 optimum 24-28 degC; a mere 3 degC rise (24->27 degC) can flip a cultivar from highly resistant to highly susceptible -- an unusually sharp, quantified threshold worth prioritising for the trigger library."
        management: >-
          NOT CHECKED AGAINST FULL TEXT (this paper is not open access -- confirmed via Europe PMC
          2026-09-26, isOpenAccess: N). The abstract itself is purely a temperature-modeling study
          and says nothing about management. This text below is unconfirmed, not disproven --
          different from the UNVERIFIED entries elsewhere in this file where an open full text was
          checked and came back empty. Original text: "Resistant cultivars matched to the locally
          prevalent race; soil solarization (2 weeks), organic manure, adjusted sowing date."

  dis:chickpea:dry_root_rot:
    - pmid: "33753791"
      title: "Low soil moisture predisposes field-grown chickpea plants to dry root rot disease: evidence from simulation modeling and correlation analysis"
      journal: "Scientific Reports"
      year: 2021
      authors: "Sinha R, Irulappan V, Patil BS, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/33753791/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
      key_findings:
        environmental: >-
          PARTIALLY RESOLVED 2026-09-26: the abstract alone (checked first) has no numeric
          thresholds, but the full text (open access, PMCID PMC7985499) does have real, usable
          numbers -- see kg/curated/env_triggers_v1.yaml
          (env:chickpea:dry_root_rot_soil_moisture): "The soil moisture content in LSM and CS was
          5-10%, whereas in the control and PS, it was around 15-25%," with the combined
          low-moisture+pathogen treatment showing the highest disease incidence. No specific soil
          temperature threshold was found even in the full text -- temperature is discussed only
          as a correlate, not a cited number. The "~35 degC / <=60%" figures originally written
          here are still NOT confirmed anywhere in this paper; do not cite them. Original
          superseded text, kept for the record: "Optimal disease progression at soil temperature
          ~35 degC and soil moisture content <= 60%."
        management: >-
          PARTIALLY VERIFIED 2026-09-26 (full text, Introduction): the "largely agronomic"
          framing is real and quoted -- see kg/curated/env_triggers_v1.yaml
          (adv:chickpea:dry_root_rot_agronomic_management): "Altering sowing time/location,
          application of soil amendments and irrigation schedule that otherwise predispose plants
          to DRR disease development can be used to manage the disease to an extent." The specific
          "flowering/podding" timing detail and the "no robust resistant sources identified"
          claim are NOT confirmed in this paper -- do not cite those specifics to this source.
          Original text, kept for the record: "No robust resistant sources identified yet in the
          literature reviewed; management is largely agronomic (irrigation scheduling to avoid
          moisture stress at flowering/podding)."

  dis:chickpea:collar_rot:
    - pmid: "30158943"
