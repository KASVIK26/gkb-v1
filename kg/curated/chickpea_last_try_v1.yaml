# Chickpea dry-root-rot and rust loci from abstracts of three papers not open-access (Crossref-verified title + abstract text): qDRR-8 (CaLG08, Talekar et al. 2021), a second dry-root-rot locus with two co-segregating SSR markers ICCM0299/ICCM0120b (Talekar et al. 2017), and the candidate gene Uca1 for chickpea rust with flanking markers TA18/TA180 (Madrid et al. 2008). Work order WO18, a last attempt at the three previously-empty chickpea diseases (2026-10-04). Evidence stays llm: (discounted); the dry-root-rot/rust loci are from abstracts only, not full text.

