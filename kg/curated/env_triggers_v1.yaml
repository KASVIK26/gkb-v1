    verified: true

  - id: pmid:33753791
    type: publication
    title: "Low soil moisture predisposes field-grown chickpea plants to dry root rot disease: evidence from simulation modeling and correlation analysis"
    year: 2021
    venue: "Scientific Reports"
    url: https://pubmed.ncbi.nlm.nih.gov/33753791/
    verified: true

  - id: pmid:42111728
    type: publication
    title: "A weather-informed decision tree framework for predicting stripe rust outbreaks in wheat"
    year: 2026
    venue: "Frontiers in Plant Science"
    url: https://pubmed.ncbi.nlm.nih.gov/42111728/
