      cloned: true

  - id: gene:wheat:Yr6NLR1
    type: Gene
    name: Yr6NLR1
    crop: wheat
    # A genuine two-gene NLR pair: BOTH genes are required together for Yr6 resistance (neither
    # mutant alone is resistant; crossing complementary mutants restores it). Modelled as two
    # separate Gene entities rather than one, since that's what they are -- not a naming quirk
    # like Lr34/Yr18/Sr57/Pm38.
    props:
      symbol: Yr6NLR1
      chromosome: 7BL
      gene_class: "NLR (paired sensor/helper with Yr6NLR2)"
      cloned: true

  - id: gene:wheat:Yr6NLR2
    type: Gene
    name: Yr6NLR2
    crop: wheat
    props:
      symbol: Yr6NLR2
      chromosome: 7BL
      gene_class: "NLR (paired sensor/helper with Yr6NLR1)"
      cloned: true

  - id: gene:wheat:Pm6
    type: Gene
    name: Pm6
    crop: wheat
    synonyms: ["Pm52"]
    props:
      symbol: Pm6
      chromosome: 2BL
      origin_species: "Triticum timopheevii"
      gene_class: "NLR with integrated PRK (pseudo-receptor kinase) domain"
      cloned: true

  - id: gene:wheat:Pm37
    type: Gene
    name: Pm37
    crop: wheat
    # A DIFFERENT allele of the Sr22 (stem rust) locus, not a synonym of it: 94.22% amino-acid
    # identity but "distinct functional divergence" per the source paper. No Sr22 entity exists
    # in this file yet, so the relationship is documented here in text rather than as a claim --
    # there's no ALLELE_OF claim type in the model to represent it properly.
    props:
      symbol: Pm37
      chromosome: 7AL
      origin_species: "Triticum monococcum (introgressed into bread wheat via T. timopheevii)"
      gene_class: NLR
      cloned: true

  - id: gene:wheat:Fhb7
    type: Gene
    name: Fhb7
    crop: wheat
    # Native locus is the very distal end of Thinopyrum elongatum chromosome arm 7EL -- not a
    # wheat chromosome letter (config/vocab chromosome validation only allows A/B/D genomes), so
    # `chromosome` records where it ends up in the specific resistant genotype these sources
    # discuss (a 7E/7D wheat-Thinopyrum substitution line), following the same convention already
    # used for Sr31/Lr26/Yr9 (rye donor, recorded on the wheat 1BL arm they translocated onto) and
    # Sr50 (rye donor, recorded on wheat 1D).
    #
    # IMPORTANT NUANCE, not swept under the rug: pmid:36015378 found Fhb7-homolog-carrying lines
    # with sharply DIFFERENT FHB outcomes -- the 7E/7D line was highly resistant, but two other
    # lines carrying near-identical (>=94% identical) Fhb7 homologs (SNTE122, TNT-B) were "highly
    # susceptible to FHB with nearly whole spike bleached." Fhb7's resistance is genuinely
    # genotype-context-dependent, not a universal drop-in fix -- don't model it as if carrying any
    # Fhb7 homolog guarantees resistance.
    props:
      symbol: Fhb7
      chromosome: "7D"
      origin_species: "Thinopyrum elongatum 7EL segment; horizontally acquired from an endophytic Epichloe fungus"
      gene_class: "glutathione S-transferase (GST); detoxifies trichothecenes via de-epoxidation"
      cloned: true

  - id: ref:wheat:LOC123169079
    type: RefGene
    name: "ABC transporter G family member 50 (LOC123169079)"
    crop: wheat
    # locus_id below is "gene-LOC123169079", not the bare "LOC123169079" -- that's the ID exactly
    # as written in the IWGSC GFF and how curator/genome/refgenes.py stores it in the bulk
    # ref_gene table (its ID has no colon to strip a prefix from, unlike chickpea/soybean's IDs),
    # so this stays joinable with that table rather than introducing a second, inconsistent form.
    props:
      locus_id: gene-LOC123169079
      assembly: IWGSC_CS_RefSeq_v2.1
      chromosome: "7D"
      start_bp: 48949410
      end_bp: 48961453
      strand: "-"
      description: "ABC transporter G family member 50"
      is_nlr: false

