        management: >-
          PARTIALLY VERIFIED 2026-09-26: the abstract does confirm QoI-resistance-driven fungicide
          stewardship as the paper's own point -- see kg/curated/env_triggers_v1.yaml
          (adv:soybean:frogeye_leaf_spot_fungicide_stewardship), quoting "Fungicides are a key
