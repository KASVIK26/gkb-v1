  - id: pmid:33609073
    type: publication
    title: "Soybean anthracnose caused by Colletotrichum species: Current status and future prospects"
    year: 2021
    venue: "Molecular Plant Pathology"
    url: https://pubmed.ncbi.nlm.nih.gov/33609073/
    verified: true

  - id: doi:10.1111/ppa.12733
    type: publication
    # No PMID exists for this paper -- confirmed via Europe PMC search (2026-09-26), which returns
    # it by DOI/title but with no PMID field. Do not invent one; cite by DOI instead.
    title: "Rhizoctonia solani: taxonomy, population biology and management of rhizoctonia seedling disease of soybean"
    year: 2018
    venue: "Plant Pathology"
    url: https://doi.org/10.1111/ppa.12733
    verified: true

entities:
  - id: env:wheat:leaf_rust_field_conditions
    type: EnvTrigger
    name: "Wheat leaf rust: field-observed temperature/humidity range for rising severity"
    crop: wheat
    props:
      # Field-correlation data from a single research station across 2 seasons, NOT a
      # controlled-inoculation infection threshold -- weighted accordingly (field_single_env)
      # rather than treated as a lab-validated infection window.
      phase: spread
      bbch_from: 30
      bbch_to: 79
      conditions:
        - {variable: air_temp_c, min: 17.8, max: 30, aggregation: max, window_h: 24}
        - {variable: air_rh, min: 76.3, max: 85, aggregation: max, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc5_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 5): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 22, max: 26, aggregation: mean, window_h: 24}

  - id: env:chickpea:fusarium_wilt_foc0_soil_temp
    type: EnvTrigger
    name: "Chickpea Fusarium wilt (Foc race 0): optimum soil temperature for infection"
    crop: chickpea
    props:
      phase: infection
      bbch_from: 9
      bbch_to: 75
      conditions:
        - {variable: soil_temp_c, min: 24, max: 28, aggregation: mean, window_h: 24}

  - id: env:chickpea:collar_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea collar rot: soil moisture band associated with rising incidence"
    crop: chickpea
    props:
      # The source paper tested 4 discrete levels (40/60/80/100% soil moisture content) and found
      # disease rising from 40% ("limiting") through 60/80/100% ("optimum" band, peaking at 80%).
      # Modelled as a single min bound at the paper's own "lower optimum" (60%) rather than
      # inventing a precise continuous curve the paper doesn't give.
      phase: infection
      bbch_from: 0
      bbch_to: 22
      conditions:
        - {variable: soil_moisture_vwc, min: 60, aggregation: mean, window_h: 24}

  - id: env:soybean:frogeye_leaf_spot_rh_temp
    type: EnvTrigger
    name: "Soybean frogeye leaf spot: 30-day RH-hours + max temperature risk model"
    crop: soybean
    props:
      phase: spread
      bbch_from: 61
      bbch_to: 79
      conditions:
        - {variable: rh_ge_80_h, min: 15, max: 20, aggregation: mean, window_h: 720}
        - {variable: air_temp_c, min: 24, max: 36, aggregation: max, window_h: 24}

  - id: env:chickpea:dry_root_rot_soil_moisture
    type: EnvTrigger
    name: "Chickpea dry root rot: low soil moisture predisposing window"
    crop: chickpea
    props:
      # From the paper's own stress-treatment comparison (full text, not just the abstract,
      # which is silent on numbers): the low-soil-moisture and combined-stress treatments were
      # both held at 5-10% soil moisture vs. 15-25% for the well-watered control/pathogen-only
      # treatment, and disease incidence was highest in the combined (low-moisture + pathogen)
      # treatment. Modelled as a max bound at the paper's own upper edge of the stressed range.
      phase: infection
      bbch_from: 61
      bbch_to: 89
      conditions:
        - {variable: soil_moisture_vwc, max: 10, aggregation: mean, window_h: 24}

  - id: env:wheat:stripe_rust_cold_humid_window
    type: EnvTrigger
    name: "Wheat stripe rust: cold, humid decision-tree window (moderate-severity branch)"
    crop: wheat
    props:
      # This is the paper's own CART model's "moderate severity" branch (34-39% severity), not
      # its higher-severity branch, which also uses sunshine-hours and a "humid thermal index"
      # composite that aren't in config/vocab/sensors.yaml -- modelled only the branch whose
      # variables map cleanly onto sensors we actually have, rather than approximating the rest.
      phase: infection
      bbch_from: 13
      bbch_to: 75
      conditions:
        - {variable: air_temp_c, max: 9.1, aggregation: min, window_h: 24}
        - {variable: dew_point_c, min: 6.2, aggregation: mean, window_h: 24}
        - {variable: air_rh, min: 94, aggregation: mean, window_h: 24}

  - id: adv:wheat:leaf_rust_fungicide_timing
    type: Advisory
    # The source paper labels its spray timings "Zadok's scale 3, ZS 4.3, ZS 5.4" -- an unusual
    # decimal notation, not the standard two-digit Zadoks codes (e.g. Z43, Z54) used in
    # config/vocab/growth_stages.yaml. Not converted to a bbch_from/bbch_to here since AdvisoryProps
    # has no such field, and normalising the paper's own odd notation without being sure it maps
    # cleanly to Z43/Z54 would be a guess, not a grounded fact.
    name: "Prothioconazole spray, one or two applications, at the paper's own stem-elongation/booting/heading timings"
    crop: wheat
    props:
      action_type: chemical

  - id: adv:soybean:frogeye_leaf_spot_fungicide_stewardship
    type: Advisory
    name: "Avoid QoI-fungicide overreliance; combine with resistant cultivars"
    crop: soybean
    props:
      action_type: chemical

  - id: adv:chickpea:dry_root_rot_agronomic_management
    type: Advisory
    name: "Adjust sowing time/location, soil amendments and irrigation to avoid DRR-predisposing conditions"
    crop: chickpea
    props:
      action_type: cultural

  - id: adv:soybean:anthracnose_seed_treatment
    type: Advisory
    # Checked all three specifics from the original candidate_papers.yaml key_finding against this
    # paper's own full-text Disease Management section: seed treatment and declining fungicide
    # sensitivity are both real and quoted below; "phosphite-based seed treatments show promise"
    # is NOT in this paper at all -- flagged as such in candidate_papers.yaml, not included here.
    name: "Systemic fungicide seed treatment; fungicide efficacy is declining"
    crop: soybean
    props:
      action_type: chemical

  - id: adv:soybean:rhizoctonia_root_rot_integrated_control
    type: Advisory
    # The abstract mentions both cultural and chemical control together as the real-world response
    # to a lack of resistant genotypes; action_type only allows one value, so "cultural" was picked
    # as representative -- the chemical-control half of the same fact is in the quote, not lost.
    name: "Cultural + chemical control, given the dearth of resistant genotypes"
    crop: soybean
    props:
      action_type: cultural

claims:
  - type: DISEASE_ENV_TRIGGER
    subject: dis:wheat:leaf_rust
    object: env:wheat:leaf_rust_field_conditions
    evidence:
      - source: pmid:38952372
        method: field_single_env
        locator: abstract
        quote: "Leaf rust severity (%) increased with an increase in maximum temperature (17.8-30 °C), maximum relative humidity (76.3-85 %)"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:fusarium_wilt
    object: env:chickpea:fusarium_wilt_foc5_soil_temp
    evidence:
      - source: pmid:18943575
        method: controlled_env
        locator: abstract
        quote: "The models estimated 22 to 26 degrees C as the most favorable soil temperature for infection of cvs. P-2245 and PV-61 by Foc-5"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:fusarium_wilt
    object: env:chickpea:fusarium_wilt_foc0_soil_temp
    evidence:
      - source: pmid:18943575
        method: controlled_env
        locator: abstract
        quote: "24 to 28 degrees C for infection of cv. P-2245 by Foc-0"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:collar_rot
    object: env:chickpea:collar_rot_soil_moisture
    evidence:
      - source: pmid:30158943
        method: controlled_env
        locator: abstract
        quote: "Maximum incidence was observed at 80% SMC, followed by 100 and 60% SMC"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:soybean:frogeye_leaf_spot
    object: env:soybean:frogeye_leaf_spot_rh_temp
    evidence:
      - source: pmid:41957394
        method: field_multi_env
        locator: abstract
        quote: "FLS risk peaked when the 30-d ma of daily hours of RH ≥ 80% was 15–20 h and maximum temperature was 24–36 °C"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:chickpea:dry_root_rot
    object: env:chickpea:dry_root_rot_soil_moisture
    evidence:
      - source: pmid:33753791
        method: controlled_env
        locator: "full text, Results"
        quote: "The soil moisture content in LSM and CS was 5-10%, whereas in the control and PS, it was around 15-25%"

  - type: DISEASE_ENV_TRIGGER
    subject: dis:wheat:stripe_rust
    object: env:wheat:stripe_rust_cold_humid_window
    evidence:
      - source: pmid:42111728
        method: field_multi_env
        locator: "full text, Results (CART model)"
        quote: "Yellow rust severity remained moderate (34-39%) when Tmin < 9.1 °C, Tdew ≥ 6.2 °C and RHm ≥ 94%"

  - type: DISEASE_MANAGED_BY
    subject: dis:wheat:leaf_rust
    object: adv:wheat:leaf_rust_fungicide_timing
    evidence:
      - source: pmid:38952372
        method: field_multi_env
        locator: "full text, Results/Discussion"
        quote: "Single and two sprays of prothioconazole, were found to be the first choice among all treatments to reduce the disease severity and increase grain production"

  - type: DISEASE_MANAGED_BY
    subject: dis:soybean:frogeye_leaf_spot
    object: adv:soybean:frogeye_leaf_spot_fungicide_stewardship
    evidence:
      - source: pmid:41957394
        method: review_statement
        locator: abstract
        quote: "Fungicides are a key management tool, particularly when susceptible cultivars are planted; however, widespread QoI resistance has raised concern about overreliance on the remaining effective fungicide classes"

  - type: DISEASE_MANAGED_BY
    subject: dis:chickpea:dry_root_rot
    object: adv:chickpea:dry_root_rot_agronomic_management
    evidence:
      - source: pmid:33753791
        method: review_statement
        locator: "full text, Introduction"
        quote: "Altering sowing time/location, application of soil amendments and irrigation schedule that otherwise predispose plants to DRR disease development can be used to manage the disease to an extent"

  - type: DISEASE_MANAGED_BY
    subject: dis:soybean:anthracnose
    object: adv:soybean:anthracnose_seed_treatment
    evidence:
      - source: pmid:33609073
        method: review_statement
        locator: "full text, Disease Management"
        quote: "To prevent the disease, seeds can be treated with systemic fungicides such as carboxanilide, dimethyldithiocarbamate, benzimidazoles, or triazoles"
      - source: pmid:33609073
        method: review_statement
        locator: "full text, Disease Management"
        quote: "in recent years several studies have shown that fungicide efficiency is gradually reducing against soybean anthracnose"

  - type: DISEASE_MANAGED_BY
    subject: dis:soybean:rhizoctonia_root_rot
    object: adv:soybean:rhizoctonia_root_rot_integrated_control
    evidence:
      - source: doi:10.1111/ppa.12733
        method: review_statement
        locator: abstract
        quote: "due to the dearth of resistant soybean genotypes...effective management options have mostly relied upon a combination of cultural and chemical control options"
