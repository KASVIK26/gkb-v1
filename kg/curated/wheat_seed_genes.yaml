# First real (non-toy) curated content, replacing archive/legacy_v1/seed_data.py.
# Every fact below was checked against its cloning paper's title/abstract on Europe PMC
# before being written here — none are typed from memory. See RESEARCH_ROADMAP.md §2.2 D3
# for the specific errors this replaces (Sr33 was wrongly given as chromosome 1B there, then
# "corrected" to 1DL during the initial audit — also wrong; verified here as 1DS).
#
# Status: status defaults to "unreviewed" below (nothing here is force-marked "reviewed" —
# that's a deliberate human sign-off step, not something to skip even when the sourcing is
# solid). Flip a claim's `status: reviewed` once you've spot-checked it yourself.
#
# 2026-09-26 addition: Yr6NLR1/Yr6NLR2, Pm6 (=Pm52), and Pm37 -- verified the same way, but this
# time by pulling the papers' own open-access full text (Europe PMC fullTextXML), not just the
# abstract, since none of the three had the chromosome/validation details in their abstract alone.

