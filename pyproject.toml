[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agrihub-kb"
version = "0.1.0"
description = "AgriHub Genomic Knowledge Base — curator pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neo4j>=5.20,<6",
    "pandas>=2.2,<3",
    "pyarrow>=17.0,<26",
    "pyyaml>=6.0,<7",
    "pydantic>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "typer>=0.12,<1",
    "rapidfuzz>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-mock>=3.14,<4",
    "pre-commit>=3.7,<5",
    "detect-secrets>=1.5,<2",
    "httpx>=0.27,<1",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
review = [
    "streamlit>=1.38,<2",
    "requests>=2.31,<3",
]
extract = [
    "langextract[openai]>=1.7,<2",
]

[project.scripts]
agrihub-pipeline = "curator.run_pipeline:main"
agrihub = "curator.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["curator*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live Neo4j connection (deselect with -m 'not integration')",
]
