      journal: "Plant Pathology"
      year: 2026
      authors: "Morier-Gxoyiya C, Bebber DP, Saunders DGO"
      url: https://bsppjournals.onlinelibrary.wiley.com/doi/10.1111/ppa.70203
      source_type: peer_reviewed_review
      verified_via: search_result
      note: "No PMID returned by Europe PMC (very recent); DOI confirmed directly on the publisher site."
      key_findings:
        environmental: "Reviews existing weather-driven infection-risk models and their data gaps; general optimum ~10-15 degC with intermittent rain/dew (per related sources)."
        management: "DMI fungicides (tebuconazole, propiconazole) effective but costly and resistance-prone; global rust surveillance network is the primary early-warning tool."

  dis:wheat:powdery_mildew:
    - pmid: "30699700"
      title: "Development of Weather- and Airborne Inoculum-Based Models to Describe Disease Severity of Wheat Powdery Mildew"
      journal: "Plant Disease"
      year: 2015
      authors: "Cao X, Yao D, Xu X, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/30699700/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
      key_findings:
        environmental: >-
          UNVERIFIED (checked 2026-09-26): this paper's abstract, freely available via Europe PMC,
          contains no temperature/RH numbers at all -- just "generalized R2 of 72.4%" for a
          temperature+humidity model. The "15-21 degC / RH>70%" figures below were apparently
