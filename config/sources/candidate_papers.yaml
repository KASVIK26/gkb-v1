soybean:
  dis:soybean:rust:
    - pmid: "32716274"
      title: "Performance and Profitability of Rain-Based Thresholds for Timing Fungicide Applications in Soybean Rust Control"
      journal: "Plant Disease"
      year: 2020
      authors: "Beruski GC, Del Ponte EM, Pereira AB, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/32716274/
      source_type: peer_reviewed_primary
      verified_via: europepmc_id
      key_findings:
        environmental: >-
          UNVERIFIED (checked 2026-09-26): this paper is not open access, and its abstract only
          names the model classes used (rain-based DSV50/DSV80, leaf-wetness-duration-temperature
          DVIP6/DVIP9) without giving the actual degree/hour values -- the "10-27.5 degC / >=6h"
          figures below are not in the abstract. Do not cite them to this source without the full
          text. Original text, kept for the record: "Infection at 10-27.5 degC (optimum 20-23
          degC) with >= 6 h dew/leaf wetness."
        management: >-
          CONTRADICTED 2026-09-26 (not just unverified -- the abstract actively says the opposite
          of what was written here): the abstract states "the economic analysis showed no
          significant differences in the risk of not offsetting the costs of fungicide sprays
          regardless of the system," and its actual conclusion is that the rain-based system is
          "a good candidate" for its "simplicity and profitability" (parity, not superiority) --
          not that it "outperforms" the calendar system "in both efficacy and cost" as the
          original text below claimed. That original claim overstated the paper's own finding and
          must not be used. Original (incorrect) text, kept for the record: "Rain-based action
          thresholds for fungicide timing outperform calendar-based spraying in both efficacy and
          cost."

  dis:soybean:charcoal_rot:
    - pmid: "42535844"
      title: "Economic Impact, Epidemiology and Environmental Drivers of Charcoal Rot of Soybean"
      journal: Phytopathology
      year: 2026
      authors: "Vaghefi N, Thorne BJ, Blanch SG, et al."
      url: https://pubmed.ncbi.nlm.nih.gov/42535844/
      source_type: peer_reviewed_review
      verified_via: europepmc_id
      key_findings:
        environmental: >-
          UNVERIFIED (checked 2026-09-26): this paper's abstract only says "high maximum air
          temperatures and low rainfalls" are associated with charcoal rot -- no numeric
          thresholds at all. The "28-35 degC" figure below is not in the abstract; do not cite it
          as this paper's finding without the full text. Kept here as a record of what needs
          re-checking: "disease severity rises at 28-35 degC soil/air temperature combined with
          low rainfall/soil moisture deficit -- directly matches the soil-probe data AgriNode
          already measures."
        management: "Resistant cultivars are the most promising lever; cultural practices (irrigation scheduling to avoid moisture stress) are the main non-genetic control."

  dis:soybean:frogeye_leaf_spot:
    - pmid: "41957394"
      title: "Modeling the environment-related risk of frogeye leaf spot (Cercospora sojina) in soybean across the United States"
